version: '3.8'

services:
  db:
    image: mariadb:11
    container_name: seismic_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s

  backend:
    build: ./backend
    container_name: seismic_backend
    restart: unless-stopped
    environment:
      HUGGINGFACE_API_TOKEN: ${HUGGINGFACE_API_TOKEN}
      HUGGINGFACE_MODEL: ${HUGGINGFACE_MODEL}
      MARIADB_HOST: ${MARIADB_HOST}
      MARIADB_PORT: ${MARIADB_PORT}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      USGS_API_URL: ${USGS_API_URL}
      POLLING_INTERVAL_SECONDS: ${POLLING_INTERVAL_SECONDS}
      FASTAPI_HOST: ${FASTAPI_HOST}
      FASTAPI_PORT: ${FASTAPI_PORT}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SQL_ECHO: ${SQL_ECHO:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: seismic_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

  mobile:
    build: ./mobile
    container_name: seismic_mobile
    restart: unless-stopped
    environment:
      # The app derives the API address from the Expo host (mobile/lib/direccion.ts); EXPO_PUBLIC_API_URL only overrides it.
      # LAN_IP is your PC's address on the local network: Expo advertises it in the QR code (the container cannot know it).
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-}
      REACT_NATIVE_PACKAGER_HOSTNAME: ${LAN_IP:-}
      EXPO_PACKAGER_HOSTNAME: ${LAN_IP:-}
    ports:
      - "8081:8081"
    depends_on:
      - backend
    volumes:
      - ./mobile:/app
      - /app/node_modules
      - /app/.expo
    stdin_open: true
    tty: true

volumes:
  mariadb_data:
    driver: local
  backend_logs:
    driver: local
